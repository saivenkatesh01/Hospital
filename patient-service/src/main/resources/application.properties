spring.config.import=optional:classpath:credentials.properties

spring.application.name=patient-service
server.port = 8082

spring.datasource.url = ${mysql.local.db.url}
spring.datasource.username = ${mysql.local.db.username}
spring.datasource.password = ${mysql.local.db.password}
spring.datasource.driver-class-name = com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql = true
spring.jpa.properties.hibernate.format_sql = true


